<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It has been a while. — Hitokoe</title>
<meta name="description" content="Missing someone means meeting them — a card from Hitokoe.">
<meta property="og:title" content="It has been a while.">
<meta property="og:description" content="Missing someone means meeting them — a card from Hitokoe.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hitokoe.app/card/og-miss.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1E9D7; --ink:#211A0E; --sub:#5A4E37; --faint:#A29574;
    --shu:#A8332C; --card:#FFFCF3; --line:#E7DCC4;
    --jp:'Klee One',serif; --sans:'Be Vietnam Pro',-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:var(--sans); padding:24px;
    background-image:radial-gradient(circle at 1px 1px, rgba(110,98,72,.05) 1px, transparent 0);
    background-size:22px 22px}
  .card{background:var(--card); border-radius:26px; padding:14px; max-width:420px; width:100%;
    box-shadow:0 18px 50px rgba(70,55,25,.16)}
  .inner{border:1.5px solid var(--line); border-radius:16px; padding:44px 28px 34px; text-align:center}
  .label{font-size:11px; letter-spacing:4px; color:var(--faint); font-weight:700}
  h1{font-family:var(--jp); font-weight:600; font-size:34px; margin:22px 0 8px}
  .sub{color:var(--sub); font-size:14px; margin:0 0 26px}
  .seal{width:44px; height:44px; border-radius:50%; background:var(--shu); color:#F7F0DD;
    display:flex; align-items:center; justify-content:center; font-size:21px; margin:0 auto 26px;
    font-family:var(--jp)}
  a.open{display:block; background:var(--ink); color:#F7F0DD; text-decoration:none;
    border-radius:999px; padding:14px; font-weight:700; font-size:15px}
  .alt{margin-top:14px; font-size:12.5px; color:var(--sub)}
  .alt a{color:var(--shu)}
</style>
</head>
<body>
  <div class="card"><div class="inner">
    <div class="label">H I T O K O E</div>
    <h1>It has been a while.</h1>
    <p class="sub">Missing someone means meeting them — a card from Hitokoe.</p>
    <div class="seal">ひ</div>
    <a class="open" id="open" href="#">Open in Hitokoe</a>
    <p class="alt">No app yet? <a href="https://hitokoe.app">See what Hitokoe is</a></p>
  </div></div>
<script>
  // The personal payload rides the #fragment — browsers never send it to the
  // host, so this page stays a dumb sign-post: no log ever contains who is
  // inviting whom.
  var m = location.hash.match(/^#q=(.*)$/);
  var target = m ? 'hitokoe://card?' + decodeURIComponent(m[1]) : 'hitokoe://';
  document.getElementById('open').href = target;
  setTimeout(function () { location.href = target; }, 350);
</script>
</body>
</html>
